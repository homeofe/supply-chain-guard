# Example GitHub Actions workflow for supply-chain-guard with SARIF output.
# Runs a scan on every push and pull request, then uploads the results
# to GitHub Code Scanning so findings appear in the Security tab and as
# annotations on the pull request.
#
# This repository runs the same shape on itself:
# .github/workflows/self-scan.yml.

name: Supply Chain Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  supply-chain-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      # Upload the SARIF report to code scanning.
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Pinned to an exact release on purpose: a security scanner should be a
      # deterministic input, so you know which detection logic and IOC feed ran.
      # The Action installs that exact version and sets up its own Node.
      # For OpenSSF Scorecard's Pinned-Dependencies, pin both actions in this
      # file by commit SHA and let Dependabot keep them current.
      - name: Run supply-chain-guard
        id: scg
        uses: homeofe/supply-chain-guard@v6.3.1
        with:
          format: sarif
          comment-on-pr: false
          fail-on: critical

      # always(): a failed gate still uploads, so its findings are annotated.
      # The report-path check skips the upload when the Action stopped before
      # writing a report (for example on an invalid input).
      - name: Upload SARIF to GitHub Code Scanning
        if: always() && steps.scg.outputs.report-path != ''
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.scg.outputs.report-path }}
          category: supply-chain-guard
