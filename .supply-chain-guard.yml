# yaml-language-server: $schema=./policy-schema.json
# supply-chain-guard policy for this repository's own self-scan.
#
# Each suppression below is a reviewed, accepted by-design tradeoff - not a
# hidden finding. The reasons are the audit trail: anyone can read why these
# are considered acceptable. Nothing here disables detection for users who
# scan their own projects; this file only applies when scanning THIS repo.

suppress:
  # The publish job needs an OIDC permission to authenticate to npm via
  # Trusted Publishing (no long-lived token). The job runs no third-party
  # actions and pins checkout and setup-node to immutable commit SHAs, so
  # there is no step that could exfiltrate the OIDC token.
  - rule: GHA_OIDC_WRITE_PERM
    reason: OIDC permission required for npm Trusted Publishing; publish job has no third-party actions and all actions are pinned to commit SHAs

  # The release job uses the built-in GitHub token only to create a GitHub
  # Release through the gh CLI. No secret is sent to any external endpoint.
  - rule: WORKFLOW_SECRET_TO_UPLOAD_PATH
    reason: built-in GitHub token used only by the release job to publish a GitHub Release via the gh CLI; no secret leaves the workflow

  # npm v7+ lockfiles list every transitive dependency at the root
  # node_modules level by design. These are not orphaned packages and the
  # finding is informational only.
  - rule: LOCKFILE_ORPHANED_DEPENDENCY
    reason: transitive dependencies at lockfile root per npm v7+ flat-install format; not orphans, informational only

  # scripts/scg-handoff-docs.mjs generates the handoff docs and its embedded
  # markdown templates legitimately contain the strings "npm publish" and
  # "NPM_TOKEN" (describing this repo's own OIDC publish pipeline). In .md
  # files these are benign-doc-excluded; in a .mjs file the Shai-Hulud
  # patterns fire by design - scripts/*.mjs is exactly where the worm lives
  # in victim repos, so the detection itself must stay strict for users.
  # This repo's own tooling discussing its publish process is not a worm.
  - rule: SHAI_HULUD_WORM
    reason: doc-generator template in scripts/scg-handoff-docs.mjs describes this repo's npm publish pipeline; detection stays active for scanned user projects

  # Two prose files quote the literal base64-decode-then-eval construct while
  # DESCRIBING the EVAL_ATOB rule and a measurement made against it. They are
  # documentation of the detection, not the thing detected. Both are scoped by
  # path: a real occurrence anywhere else in this tree, including src/, still
  # fails the self-scan at critical. Detection is untouched for user projects.
  - rule: EVAL_ATOB
    path: CHANGELOG.md
    reason: changelog entry quotes the base64-decode-then-eval construct while describing the EVAL_ATOB rule and the measured effect of rules.disable on it; prose about the detection, not a payload

  - rule: EVAL_ATOB
    path: .ai/handoff/STATUS.md
    reason: handoff note quotes the same construct while recording that measurement; prose about the detection, not a payload

  # Documentation that quotes the internal-disclosure rules' own test data.
  # These surfaced when the self-scan became visible in code scanning
  # (.github/workflows/self-scan.yml); below critical they had never been
  # looked at. Each value was read: RFC 1918 and link-local example addresses
  # and reserved-looking host suffixes, used to show what the rules reject.
  # Path-scoped, so a real address or host anywhere else still reports.
  - rule: INTERNAL_PRIVATE_IP
    path: docs/plans/2026-09-16-threat-feed-catalog-phase-1.md
    reason: plan document quotes the catalog-hygiene test's RFC 1918 and link-local example addresses, which the test asserts are rejected; test data about the detection, not infrastructure

  - rule: INTERNAL_HOSTNAME
    path: docs/plans/2026-09-16-threat-feed-catalog-phase-1.md
    reason: the same test quotes example hosts under private-network suffixes, which must be rejected; test data, not hosts

  - rule: INTERNAL_HOSTNAME
    path: CHANGELOG.md
    reason: changelog entries describe the internal-disclosure rules with example host-name keys; prose about the detection

  - rule: INTERNAL_HOSTNAME
    path: .ai/handoff/STATUS.md
    reason: handoff notes record the same rule work with example host-name keys; prose about the detection

  # --- Scanning this repository with a scanner of a different version ---
  #
  # The scanner recognises its OWN inert IOC definitions by content: an exact
  # path plus the SHA-256 recorded in the self-scan-manifest.json that ships with
  # the RUNNING scanner (src/self-scan-trust.ts). That holds only when scanner and
  # checkout are the same version, as in CI, where dist/cli.js scans the tree it
  # was built from. Anyone who runs an installed release against this repository
  # scans a different version: the daily threat-intel import changes
  # src/threat-intel.ts every day, so the digests never match and the feed, the
  # blocklist and the tests that quote them are read as findings by the IOC
  # rules they define.
  #
  # The entries below cover exactly those rule and file pairs, measured from
  # both scans. They are scoped by rule AND path: every other rule still runs on
  # these files, and the same indicator anywhere else in the tree still reports.
  # In CI the files are recognised by digest first, so these entries do not
  # change the CI self-scan verdict; they exist for scans with any other
  # version. Pinned by src/__tests__/self-scan-policy.test.ts.

