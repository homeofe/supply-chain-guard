name: Daily feed channel

# Publishes the signed threat feed every day, without a release, on GitHub
# Pages under /feed/ (docs/daily-feed-channel-design.md).
#
# What reaches users this way is what the owner approved on 2026-10-21 and
# nothing else: main's reviewed feed unchanged, plus exact-version pins whose
# version a source names (the importer's `listed` derivation), plus hashes,
# plus the catalog entries main gained since the latest release.
# scripts/build-daily-feed.mjs enforces that against main's feed.
#
# Three jobs, so that the code that installs and runs dependencies never sees
# the signing key:
#   build   installs dependencies, runs the importer and the builder, validates
#           the result with the client's parser. No environment, no secret.
#   sign    environment feed-publish (main and the release tags only). Installs
#           NOTHING: it checks out the same commit, re-runs the invariant on
#           the built feed itself (`--verify`, node builtins only), then signs.
#   deploy  the only job with Pages write; runs no repository code.
#
# Any failed step publishes nothing. The channel then keeps yesterday's feed,
# whose age stays visible to clients and to the freshness check in
# feed-reconcile.yml, which runs in a different workflow so it also notices
# this one not running at all.

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-daily
  cancel-in-progress: false

jobs:
  build:
    name: Build the daily feed
    # A manual run from another branch must not publish that branch's feed.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      sha: ${{ steps.release.outputs.sha }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          # The tags, to find the latest release's catalog.
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      # dist/feed.js is the client's own parser, used to validate below.
      - name: Build
        run: npm run build

      - name: Check out the latest release
        id: release
        run: |
          tag=$(git tag --list 'v*.*.*' --sort=-v:refname | head -n 1)
          if [ -z "$tag" ]; then echo "::error::no release tag found"; exit 1; fi
          git worktree add --detach "$RUNNER_TEMP/release" "$tag"
          echo "Latest release: $tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Propose new entries (importer dry run)
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          # Read-only token for the advisory and dataset APIs (anonymous calls
          # get 60 per hour per address).
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/import-threat-feed.mjs --dry-run --json > "$RUNNER_TEMP/report.json"

      - name: Build the daily feed and check it against main
        run: >-
          node scripts/build-daily-feed.mjs
          --report "$RUNNER_TEMP/report.json"
          --main-root .
          --release-root "$RUNNER_TEMP/release"
          --out "$RUNNER_TEMP/daily"

      - name: Validate with the client's parser
        run: |
          node -e '
            const { readFileSync } = require("node:fs");
            const { parseFeedDocument } = require("./dist/feed.js");
            const text = readFileSync(process.argv[1], "utf8");
            const { entries, generatedAt } = parseFeedDocument(text);
            const declared = JSON.parse(text).entryCount;
            if (entries.length !== declared) throw new Error(`parsed ${entries.length} of ${declared} entries`);
            if (!generatedAt) throw new Error("no generatedAt");
            console.log(`${entries.length} entries valid, generatedAt ${generatedAt}`);
          ' "$RUNNER_TEMP/daily/feed.json"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-feed
          path: ${{ runner.temp }}/daily/feed.json
          if-no-files-found: error
          retention-days: 3

  sign:
    name: Verify and sign the daily feed
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: feed-publish
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.build.outputs.sha }}
          fetch-depth: 0
          persist-credentials: false

      # No cache and no install: everything below uses node builtins only.
      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Check out the same release
        env:
          TAG: ${{ needs.build.outputs.tag }}
        run: git worktree add --detach "$RUNNER_TEMP/release" "$TAG"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: daily-feed
          path: ${{ runner.temp }}/site/feed

      - name: Re-check the built feed against main
        run: >-
          node scripts/build-daily-feed.mjs --verify "$RUNNER_TEMP/site/feed/feed.json"
          --main-root .
          --release-root "$RUNNER_TEMP/release"

      - name: Sign the daily feed
        env:
          FEED_SIGNING_KEY: ${{ secrets.FEED_SIGNING_KEY }}
        run: node scripts/sign-feed.mjs "$RUNNER_TEMP/site/feed/feed.json" "$RUNNER_TEMP/site/feed/feed.json.sig"

      # For networks without internet access: the same two files in one archive,
      # and checksums of all three (README, "Air-gapped networks").
      - name: Offline archive and checksums
        working-directory: ${{ runner.temp }}/site/feed
        run: |
          tar -czf feed-offline.tar.gz feed.json feed.json.sig
          sha256sum feed.json feed.json.sig feed-offline.tar.gz > SHA256SUMS
          cat SHA256SUMS

      # The site is static and has no build step yet. When the website project
      # adds one, it runs in its own job, and a failure there makes this job use
      # site/index.html as committed, so the feed still deploys.
      - name: Add the site
        run: cp -R site/. "$RUNNER_TEMP/site/"

      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Deploy to GitHub Pages
    needs: sign
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
