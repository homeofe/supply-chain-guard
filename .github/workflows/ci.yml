name: CI

on:
  push:
    branches: [main]
    tags:
      # Full semver only (v5.2.35). The floating major ref `v5` is a BRANCH,
      # not a tag - matching `v*` here would let the major tag (if one ever
      # appears) trigger publish and try to re-publish an existing version.
      # See the v5.2.35 incident: a stray `v5` tag triggered a failed publish.
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [main]
    # Code-validation event set: every event that can change the code or the
    # effective merge result, and nothing else.
    #
    # `edited` is deliberately ABSENT. It was here so the AI-attribution gate
    # re-ran on a title or body edit, which meant every metadata edit started the
    # full build, test, package and security pipeline against a head commit whose
    # content had not changed. That half of the gate now lives in
    # pr-metadata-policy.yml, which owns the "PR metadata policy" required check.
    #
    # `ready_for_review` is deliberately ABSENT, for the same reason `edited` is.
    # It creates no new head sha, and no job here is draft-gated, so a draft PR's
    # `opened` and `synchronize` runs have already made that sha conclusive. Adding it
    # back starts a second full matrix plus a container build on an identical tree and,
    # because cancel-in-progress is true for pull_request, cancels an in-flight one:
    # a duplicate build on unchanged code that can replace a green result with a
    # cancelled one.
    types: [opened, synchronize, reopened]
  # Manual runs are build-only. Publishing is possible only from an immutable
  # semver tag delivered by the push trigger above.
  workflow_dispatch:

permissions:
  contents: read

# Obsolete code-validation runs are cancelled when a NEWER HEAD COMMIT supersedes
# them, so the newest head sha decides mergeability. Metadata edits can no longer
# enter this group at all, because `edited` is not a trigger here - so a body fix
# can never cancel a valid result for an unchanged head sha, which is how a
# cancelled twin previously became the effective result and blocked a merge.
#
# Tag and main pushes are keyed by ref and never cancelled, so a release cannot be
# aborted by a later one.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Complete build and test on every Node major this repository RUNS. That is not
  # the same set as the majors it SUPPORTS, and the difference is deliberate.
  #
  # THE INVARIANT, so that an edit to either side has something to preserve:
  #
  #   this matrix  ==  supportedMajors + transitionMajors  (docs/node-support.md)
  #
  #   supportedMajors  majors the package promises to work on. Every one is at or
  #                    above engines.node in package.json, and the highest reaches
  #                    at least activeLtsMajor, the upstream Active LTS. Without
  #                    that upper assertion, engines.node ">=22.0.0" would go on
  #                    claiming every major above 22 with none of them executed.
  #   transitionMajors majors still fully tested but BELOW the floor and OUT OF
  #                    SUPPORT, so a consumer who has not migrated is warned by
  #                    npm rather than broken. Each one carries the release that
  #                    deletes it. Node 20 reached end of life on 2026-04-30 and
  #                    its lane is deleted in 5.29.0.
  #
  # So a leg below engines.node is expected here and is not a support claim, and a
  # leg above engines.node is required here and is not optional coverage.
  #
  # The contract each leg proves: the package must install, pass every governance
  # gate, pass the FULL suite, and run FROM ITS PACKED TARBALL. There is
  # deliberately no reduced smoke lane, because a lane that runs less than the
  # real suite proves less than the real suite, and the difference is exactly
  # where a version incompatibility hides.
  #
  # This list is DERIVED from docs/node-support.md, which is the single
  # authoritative policy. Do not treat this list as the source of truth.
  # src/__tests__/node-version-contract.test.ts fails the build if this matrix,
  # or any other declaration site in the repo, drifts from that policy.
  compat:
    name: compat (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # Every leg always reports. Stopping the 22 and 24 legs because 20 failed
      # would hide the compatibility difference this matrix exists to surface.
      fail-fast: false
      matrix:
        node: ['20', '22', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the AI-attribution gate can walk the PR commit range.
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build

      # AI-attribution gate for the COMMIT surfaces: commit messages and the
      # author/committer identity fields across the PR's BASE..HEAD range. Their
      # input is the commit range, so they belong with code validation and re-run
      # only when the code changes.
      #
      # The PR TITLE and BODY halves moved to pr-metadata-policy.yml, which owns
      # the "PR metadata policy" required check. Do not re-add them here: that is
      # what forced `edited` into this workflow's triggers and made every body edit
      # run the whole pipeline. One producer per required check.
      #
      # Tracked files (CHANGELOG.md, which ci.yml turns into the GitHub Release
      # body, plus README/docs) are covered by the "ai-attribution"
      # forbiddenPatterns rule in aahp.config.json, which already ran as part of
      # `npm run build` above.
      #
      # dependabot is exempt for the same reason aahp-verify.yml exempts it: its
      # commit messages quote upstream release notes, and this step sits in a
      # REQUIRED check with enforce_admins - so a quoted trailer upstream would
      # hard-block a security update with no way out.
      - name: No AI attribution in commit messages or identity
        if: github.event_name == 'pull_request' && github.actor != 'dependabot[bot]'
        env:
          # Event-payload values reach the script as environment variables and are
          # only ever read as quoted "$VAR". Never write ${{ ... }} inside a run:
          # block - Actions substitutes the raw text BEFORE bash parses it, so
          # attacker-controlled content would execute on the runner.
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # POSIX-ERE twin of the aahp.config.json "ai-attribution" rule; grep -E has
          # no (?:...) syntax, so the groups are plain (...). Keep the two in lockstep.
          # PROSE that merely describes a footer does not match, which is what keeps
          # this gate from flagging its own definition and CONTRIBUTING.md's wording.
          # Anchored on attribution PHRASING plus the anthropic no-reply address, not
          # on the brand name, so this repo's legitimate threat intelligence about
          # Claude-branded malware ("Claude Code leak campaign") does not trip it.
          PATTERN='(generated|created|authored|assisted|written)[ \t]+(with|by)[ \t]+\[?[^ ]{0,20}claude|(co-authored|assisted|generated|created)-by:[^\n]*(claude|anthropic)|noreply@anthropic\.com|\[Claude Code\]\(|claude\.(com/claude-code|ai/code)'
          fail=0

          # Fail closed on a malformed event payload. Without this, an empty BASE_SHA
          # makes git resolve "..$HEAD_SHA" as "HEAD..$HEAD_SHA", which is empty on the
          # checked-out merge commit, so git exits 0 and the gate PASSES having
          # inspected nothing.
          if [ -z "$BASE_SHA" ] || [ -z "$HEAD_SHA" ]; then
            echo "::error title=PR sha missing::base.sha or head.sha absent from the event payload; refusing to pass without checking."
            exit 1
          fi
          for sha in "$BASE_SHA" "$HEAD_SHA"; do
            if ! git rev-parse --verify --quiet "$sha^{commit}" >/dev/null; then
              echo "::error title=PR sha not fetched::$sha is not in the object graph. Usually a synchronize race (the head moved mid-run); re-run the job."
              exit 1
            fi
          done

          # Fail closed: if the range cannot be read, do NOT silently pass. A bare
          # `git log ... | grep` would swallow the git failure and report clean.
          if ! SHAS=$(git log --format='%H' "$BASE_SHA..$HEAD_SHA"); then
            echo "::error title=Cannot read PR commit range::git log $BASE_SHA..$HEAD_SHA failed even though both endpoints verified. Inspect the checkout step."
            exit 1
          fi

          # Per commit, so a revert or cherry-pick can be exempted. main carries 137
          # commits whose messages contain an inherited trailer, and `git revert` copies
          # the body verbatim: without this, reverting the repo's own history would be
          # permanently unmergeable through a rule the author never typed.
          for sha in $SHAS; do
            BODY=$(git log -1 --format='%B' "$sha")
            case "$BODY" in
              *"This reverts commit"*|*"cherry picked from commit"*)
                echo "note: skipping $sha (revert/cherry-pick, trailer is inherited)"
                continue
                ;;
            esac
            if printf '%s' "$BODY" | grep -Eiq -- "$PATTERN"; then
              echo "::error title=AI attribution in a commit message::$sha carries an attribution footer or a Co-Authored-By trailer. Rewrite it before merging - once merged the message is permanent. See CONTRIBUTING.md."
              git log -1 --format='  %h %s' "$sha" >&2
              fail=1
            fi
            # The identity fields are published on the commit page even when the body is
            # clean, so "the author of record is the human" has to cover them too.
            IDENT=$(git log -1 --format='%an%n%ae%n%cn%n%ce' "$sha")
            if printf '%s' "$IDENT" | grep -Eiq -- 'claude|anthropic\.com'; then
              echo "::error title=AI attribution in commit identity::$sha is authored or committed as an AI identity ($(printf '%s' "$IDENT" | tr '\n' ' ')). Re-author it with git commit --amend --reset-author. See CONTRIBUTING.md."
              fail=1
            fi
          done

          if [ "$fail" -ne 0 ]; then
            exit 1
          fi
          echo "No AI attribution in commit messages or author identity."
      # AAHP conformance (v3.6+): the pinned @elvatis_com/aahp CLI self-checks handoff
      # set, MANIFEST schema, grounding, the exact-version dep pin, changelog format and
      # version sync. --no-install forces the pinned node_modules copy, not a fetched one.
      - name: AAHP conformance
        run: npx --no-install aahp doctor . --json

      # Self-scan: this repository, inspected by the scanner this repository ships.
      #
      # WHY THIS EXISTS
      # ---------------
      # Every other CLI invocation in this pipeline validates the DISTRIBUTION:
      # that the package installs, that the image starts, that a scan of a
      # four-line fixture emits parseable JSON. Those are liveness probes. None
      # of them inspects the CONTENT of this tree. Until this step existed, every
      # rule this tool enforces on its consumers was unenforced on its own
      # source, and the required "Build and Test" context that gates an npm
      # release proved nothing about what was in the release. A scanner that does
      # not scan itself is a trust claim nobody has tested.
      #
      # WHY THIS EXACT WIRING
      # ---------------------
      # It runs the locally built CLI from the checkout root, and that is not
      # incidental. isOwnPackageRoot in src/scanner.ts compares the resolved scan
      # target against the scanner's own install root; only when they match does
      # the SELF_SCAN_INERT_FILES allowlist apply and .supply-chain-guard.yml get
      # read from this directory. Scanning this same tree through a container
      # mount instead (reusing the docker step below looks cheaper) makes that
      # comparison false, which switches the allowlist and the policy off and
      # reports roughly 1700 self-referential findings on detector definitions
      # the tool ships deliberately. That number is measured, not estimated. A
      # step like that gets switched off within a week, which is the failure mode
      # this gate was added to prevent. Do not rewire it that way.
      #
      # There is deliberately no `if:` condition. A step keyed on a matrix value
      # such as `matrix.node == '22'` disappears in silence on the day that value
      # leaves the matrix, which is the same class of defect as the missing gate
      # itself. Running on every leg costs the measured scanner time (about 9 s)
      # twice, inside a job that already runs npm ci, npm audit, tsc, the full
      # suite with coverage, and a clean-room tarball install.
      #
      # --no-history because the checkout is fetch-depth 0: a history scan would
      # walk every commit ever made and report content that no pull request can
      # change. This step is a gate on the working tree.
      #
      # THRESHOLD
      # ---------
      # --fail-on critical, chosen rather than inherited. The measurement behind
      # it: with the three fixes that ship alongside this step, the tree reports
      # ZERO findings at every severity, plus seven findings suppressed by
      # .supply-chain-guard.yml, each carrying a written reason. So `critical` is
      # not the strictest threshold this tree can hold today; `--fail-on info`
      # would also pass on this commit.
      #
      # `critical` is still the deliberate choice. It is the severity at which a
      # finding is a regression rather than a backlog item, and it already covers
      # the only recurring finding source this repository has: threat-intelligence
      # releases, which add real indicators to CHANGELOG.md and to feed.json and
      # surface as critical. A stricter threshold buys coverage of severities that
      # currently have no instances and no known source here, and pays for it by
      # turning unrelated pull requests red. A gate that blocks unrelated work is
      # a gate somebody deletes.
      #
      # OPEN DECISION for the maintainer, written here rather than in a pull
      # request comment so that the next reader meets it: tighten to
      # `--fail-on high`, or lower, once this step has enough history to show what
      # actually appears at those severities. Whoever tightens it should re-run
      # the mutations described in src/__tests__/issue-173-self-scan-gate.test.ts.
      #
      # Exit codes from getReportExitCode in src/reporter.ts, with --fail-on set:
      # 0 = nothing at or above the threshold and the scan was complete;
      # 1 = a finding at or above the threshold, OR a partial scan. A partial scan
      # failing the gate is intended: a scan that could not read part of the tree
      # has not cleared the part it could not read.
      - name: Self-scan this repository
        run: |
          report="$RUNNER_TEMP/self-scan.json"

          # The report is written OUTSIDE the checkout on purpose. Written into
          # it, the file would still be sitting in the tree when npm pack and the
          # governance gates run later in this same job.
          rc=0
          node dist/cli.js scan . --fail-on critical --format json --no-history > "$report" || rc=$?

          # POSITIVE CONTROL. A green verdict produced by inspecting the wrong
          # directory is indistinguishable from a green verdict produced by a
          # clean tree, and that ambiguity is exactly the defect this step closes.
          # So the step has to prove it looked at this repository before its
          # verdict is allowed to mean anything.
          #
          # The floor is DERIVED from the checkout rather than hardcoded: it is
          # the number of TypeScript sources tracked under src/ (192 when this
          # was written, against 407 files actually inspected). Every one of them
          # lives under the checkout root and is plain text the scanner includes,
          # so any scan genuinely rooted here inspects at least that many. The CI
          # fixture directory inspects 1. Deriving the number means it tracks the
          # repository instead of decaying into a stale constant that nobody
          # remembers how to justify.
          #
          # `|| true` and not `|| echo 0`: grep -c already PRINTS 0 when it
          # matches nothing, and additionally exits 1, so an `echo 0` fallback
          # appends a second zero and floor becomes two lines. The numeric test
          # below then aborts with "integer expression expected" instead of the
          # legible message it exists to print. A gate that fails illegibly is
          # most of the way to a gate nobody trusts.
          floor=$(git ls-files -- src | grep -c '\.ts$' || true)
          if [ "$floor" -eq 0 ]; then
            echo "::error title=Self-scan control::No TypeScript sources found under src/, so no file-count floor can be established. Refusing to pass without a control."
            exit 1
          fi

          REPORT="$report" FLOOR="$floor" node -e '
            const fs = require("fs");
            const r = JSON.parse(fs.readFileSync(process.env.REPORT, "utf8"));
            const scanned = r.summary.filesScanned;
            const floor = Number(process.env.FLOOR);
            console.log("self-scan: " + scanned + " of " + r.summary.totalFiles +
              " files inspected, " + r.findings.length + " findings, " +
              (r.suppressedCount || 0) + " suppressed by .supply-chain-guard.yml");
            for (const f of r.findings) {
              console.log("  " + f.severity + "  " + f.rule + "  " + f.file + (f.line ? ":" + f.line : ""));
            }
            if (!(scanned >= floor)) {
              console.error("::error title=Self-scan target::Only " + scanned +
                " files were inspected, but this checkout tracks " + floor +
                " TypeScript sources under src/. The scan did not cover this repository, so its verdict means nothing.");
              process.exit(1);
            }
          '

          if [ "$rc" -ne 0 ]; then
            echo "::error title=Self-scan::The scanner reported a finding at or above critical on this repository, or could not scan it completely (exit $rc). Fix the finding, or add a reviewed suppression with a written reason to .supply-chain-guard.yml. Do not silence it here."
            exit "$rc"
          fi
          echo "Self-scan clean at the critical threshold."

      - name: Test
        run: npm run test:coverage

      # Validates the ARTIFACT rather than the working tree: packs, inspects what
      # came out, installs the tarball into a directory that shares nothing with
      # this checkout, and drives the CLI and the programmatic entry point from
      # that install. A build that emits nothing, an entry point aimed at a
      # missing file, an unshipped data file or a bin that is not executable all
      # survive a green suite and break on `npm install`. Running it inside the
      # matrix is what makes it a compatibility check and not just a packaging one.
      - name: Validate the packaged artifact
        run: bash scripts/validate-package.sh

      - name: Upload coverage summary
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          # Per-major name: matrix legs uploading one artifact name collide.
          name: coverage-summary-node${{ matrix.node }}
          path: coverage/coverage-summary.json
          retention-days: 14

  # The container distribution channel, validated at PULL REQUEST time.
  #
  # docker.yml already builds this image multi-arch and pushes it to ghcr, but it
  # triggers ONLY on a full semver tag. So before this job existed, the first time a
  # Dockerfile change or a base image bump was ever built was during the release
  # itself, after the decision to publish had already been taken. dependabot opens a
  # weekly PR to bump the digest-pinned base image, and those PRs were merged on a
  # pipeline that never invoked `docker build` even once: "green" was evidence about
  # the npm package and said nothing about the image.
  #
  # This job does NOT duplicate docker.yml. It builds a single-arch image and never
  # pushes; publishing multi-arch on a tag stays where it is. What it adds is that a
  # broken container path is discovered on the PR rather than during a release.
  #
  # It is wired into the "Build and Test" aggregator rather than becoming a fourth
  # required context, so it blocks a merge without another branch-protection change
  # and without a second check name to keep in sync. Because `publish` needs `build`,
  # it also means the image is proven to build and scan before npm publishes.
  docker:
    name: Docker build and smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Both stages, explicitly. Building only the final image would still exercise
      # the builder, but naming it separately means a compile failure is reported as
      # a compile failure instead of as an opaque final-stage error.
      - name: Build the builder stage
        run: docker build --target builder -t scg-builder:ci .

      - name: Build the runtime image
        run: docker build -t scg:ci .

      # The image must run the major the Node policy declares, read FROM the policy
      # rather than hardcoded, so this cannot drift from docs/node-support.md.
      - name: The image runs the declared runtime major
        run: |
          expected=$(node -e "const m=require('fs').readFileSync('docs/node-support.md','utf8').match(/\`\`\`json\s*\n([\s\S]*?)\n\`\`\`/);process.stdout.write(String(JSON.parse(m[1]).runtimeMajor))")
          actual=$(docker run --rm --entrypoint node scg:ci -p 'process.versions.node.split(".")[0]')
          echo "policy runtimeMajor=$expected  image node major=$actual"
          if [ "$expected" != "$actual" ]; then
            echo "::error title=Docker runtime major::The image runs Node $actual but docs/node-support.md declares $expected."
            exit 1
          fi

      # ENTRYPOINT is the CLI itself, so the image is driven the way a user drives it.
      - name: The packaged CLI in the image reports the right version
        run: |
          expected=$(node -p "require('./package.json').version")
          actual=$(docker run --rm scg:ci --version | tr -d '[:space:]')
          echo "package.json=$expected  image=$actual"
          test "$expected" = "$actual"

      # The point of the artifact. An image that starts and then cannot finish a scan,
      # because a data file was left out of the tarball or a native tool is missing,
      # passes every check above.
      - name: The image completes a real scan
        run: |
          mkdir -p /tmp/fixture
          printf '{\n  "name": "fixture",\n  "version": "1.0.0",\n  "dependencies": { "express": "4.18.2" }\n}\n' > /tmp/fixture/package.json
          # Exit code is a findings verdict, not a health signal: this CLI exits
          # non-zero when it finds something. Only unparseable output means broken.
          set +e
          out=$(docker run --rm -v /tmp/fixture:/scan scg:ci scan /scan --format json --no-history 2>&1)
          rc=$?
          set -e
          echo "$out" | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>{JSON.parse(d)})" \
            || { echo "::error title=Docker scan::image did not emit parseable JSON (exit $rc)"; echo "$out" | head -20; exit 1; }
          echo "Image completed a scan and emitted parseable JSON (exit $rc)."


  # Aggregator. "Build and Test" is a REQUIRED status check, and its NAME is a
  # contract with branch protection, so it stays one context with one producer
  # even though the work now runs once per Node major plus a container build.
  #
  # Renaming the matrix job to this instead would produce "Build and Test (20)"
  # and "Build and Test (22)" and delete the context branch protection waits for,
  # blocking every PR on a check that never arrives. That failure mode is not
  # hypothetical: it was measured on PR #159, where a workflow missing the
  # `synchronize` trigger left head shas with no run of a required check at all.
  #
  # `if: always()` matters. Without it this job is SKIPPED when a dependency
  # fails, and a skipped required check is not a failing one, so a red matrix
  # could report as a non-failure. It runs unconditionally and decides explicitly.
  build:
    name: Build and Test
    needs: [compat, docker]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require every Node major to have passed
        env:
          COMPAT_RESULT: ${{ needs.compat.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          echo "Node compatibility matrix: $COMPAT_RESULT"
          echo "Docker image build:          $DOCKER_RESULT"
          fail=0
          if [ "$COMPAT_RESULT" != "success" ]; then
            echo "::error title=Node compatibility::At least one Node major did not pass. Open the compat legs to see which."
            fail=1
          fi
          if [ "$DOCKER_RESULT" != "success" ]; then
            echo "::error title=Docker image::The container distribution channel did not build or did not scan."
            fail=1
          fi
          if [ "$fail" -ne 0 ]; then exit 1; fi
          echo "Every Node major passed and the container image builds and scans."


  # WHICH REQUIRED CHECKS ACTUALLY RUN ON A TAG REF
  # ----------------------------------------------
  # Branch protection on main requires three contexts. Only ONE of them can exist on
  # a refs/tags/* push, because required status checks are a property of the BRANCH
  # and the two ref namespaces do not intersect. Measured over the run history:
  #
  #   Build and Test       RUNS on a tag ref. This workflow carries a `tags:` trigger,
  #                        and `needs: build` below makes it block the publish.
  #   aahp-verify          does NOT. Its push trigger is `branches: [main]`, and it has
  #                        no tag-ref run in its last 100.
  #   PR metadata policy   does NOT. It triggers on pull_request only, and has no
  #                        tag-ref run in its entire history.
  #
  # So arriving on a tag proves the code built, tested and scanned on every supported
  # Node major. It proves nothing about WHERE the commit lives, and branch protection
  # never gets a chance to say so. The ancestry gate below is that second half, and it
  # is what stands between one mistyped `git tag` and four public distribution
  # channels: npm plus its `latest` dist-tag, the GitHub Release, the container image
  # including :latest, and the floating v5 branch that `uses: ...@v5` resolves to.
  publish:
    name: Publish to npm
    needs: build
    runs-on: ubuntu-latest
    # Only a pushed full-semver tag can publish. Manual dispatch is build-only,
    # and a major-only ref such as refs/tags/v5 must never reach this job.
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history, and NOT optional. The ancestry gate below cannot decide
          # ancestry in a shallow checkout, so it refuses to answer rather than
          # answering from the handful of commits a depth-1 fetch happens to hold.
          # Deleting this line therefore turns every release red, which is the point:
          # the alternative is a gate that keeps reporting green while inspecting
          # almost nothing.
          fetch-depth: 0

      # The release-authority gate. docs/ci-and-release.md says to tag the MERGED commit
      # on main and never the pre-merge commit, and this repository squash-merges, so
      # those two ALWAYS have different shas. That sentence was written down on
      # 2026-08-20, in the 5.28.0 release, and 135 of the 138 tags to date predate it;
      # before this step it was prose either way. No tag has ever pointed off main:
      # measured 2026-08-22, all 138 semver tags are ancestors of main. That is a
      # convention holding, not a gate enforcing, which is what this step changes.
      #
      # Runs before every other step in this job, including the tag validator, because
      # the tag validator only compares the tag string against package.json and is
      # satisfied by any commit at all whose version field matches. `needs: build`
      # above already made this job wait for the compat matrix and the container build
      # and scan, but passing those says nothing about where the commit lives.
      #
      # See scripts/check-release-ancestry.mjs for the exit codes: "cannot answer" is
      # a different code from "answered no", so a green run here means the question
      # was really asked. Node is preinstalled on the runner, which is why this and
      # the tag validator can both run before the Setup Node.js step.
      #
      # WHAT THIS GATE DOES NOT COVER, so the next reader does not overestimate it:
      #   * Actions runs a workflow from the file present at the PUSHED ref, so this
      #     step exists only on tags whose commit already contains it. A tag cut from a
      #     commit that predates this change publishes ungated, and an actor who
      #     controls the commit controls its ci.yml and can simply omit the step. This
      #     binds the accident, not the deliberate case. The control for the deliberate
      #     case is a ruleset restricting creation of refs/tags/v*, an open owner
      #     decision on https://github.com/homeofe/supply-chain-guard/issues/167.
      #   * The branch is not overridable here: the script is called with no arguments,
      #     so it checks against main. A release from a maintenance branch would need
      #     --branch passed in this file, which is a deliberate edit.
      #   * The gate performs a network `git fetch` of main, so an unreachable origin
      #     surfaces as exit 5, a red release rather than a silent pass. It does NOT
      #     need the checkout's credentials: this repository is public, and an
      #     unauthenticated `git ls-remote` of refs/heads/main was verified to resolve
      #     on 2026-08-22, so persist-credentials: false, proposed in
      #     https://github.com/homeofe/supply-chain-guard/issues/179, leaves it working.
      - name: Require the released commit to be on main
        run: node scripts/check-release-ancestry.mjs

      - name: Validate immutable release tag
        run: |
          if ! node -e 'const v=require("./package.json").version; const t=process.env.GITHUB_REF_NAME; if (t !== `v${v}` || !/^v\d+\.\d+\.\d+$/.test(t)) process.exit(1)'; then
            echo "::error title=Invalid release tag::Tag must be exact vMAJOR.MINOR.PATCH and equal package.json version."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Build
        run: npm run build

      # npm Trusted Publishing (OIDC) requires npm >= 11.5.1, and this step is
      # STILL required on Node 22: Node 22.23.2 bundles npm 10.9.8, which silently
      # falls back to classic token auth even when id-token: write is granted.
      # Checked against nodejs.org/dist rather than assumed, because "the newer Node
      # surely bundles a newer npm" is the kind of guess that burns a version number.
      #
      # The pin stays at 11.18.0 across the move from Node 20 to Node 22. Its engine
      # range is ^20.17.0 || >=22.9.0, so it runs on this runner unchanged. npm@latest
      # is now 12.0.2 and would also run here, but this lane CANNOT BE REHEARSED: it
      # executes only on a tag push, authenticates by OIDC which no dry run exercises,
      # and a failure burns a version because tags are immutable. So exactly one
      # variable moves per release, and this release the variable is the Node major.
      # Re-review the engine range before changing either version.
      - name: Upgrade npm for OIDC trusted publishing
        run: |
          npm install --global --ignore-scripts npm@11.18.0
          test "$(npm --version)" = "11.18.0"

      # Auth happens via OIDC against the npmjs Trusted Publisher
      # configured for this package + this workflow. No NPM_TOKEN
      # secret is used or needed.
      - name: Publish to npm
        run: npm publish --access public --provenance

  release:
    name: Create GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Extract changelog for this version
        id: changelog
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Extract the section for this version from CHANGELOG.md (moved out of
          # README.md in v5.2.45 to keep the landing page readable).
          # NOT an awk range pattern: /start/,/end/ terminates on the SAME line
          # when the heading matches both expressions, which yielded one line,
          # then head -n -1 emptied it - every release before v5.2.45 silently
          # shipped the fallback text. Flag-based scan fixed it.
          # Literal prefix match via index() - avoids awk-variant differences in how
          # "\\[" inside a string-regex is handled (gawk collapses it to a char class).
          NOTES=$(awk -v ver="$VERSION" '
            index($0, "## [" ver "]") == 1 {flag=1; print; next}
            flag && index($0, "## [") == 1 {exit}
            flag {print}
          ' CHANGELOG.md)
          # Fallback if nothing found
          if [ -z "$NOTES" ]; then
            NOTES="See [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for full changelog."
          fi
          # Write to file to preserve multiline
          echo "$NOTES" > release_notes.md

      - name: Create GitHub Release
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "supply-chain-guard $GITHUB_REF_NAME" \
            --notes-file release_notes.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  update-major-branch:
    name: Update major version branch
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Floating major-version branch so `uses: homeofe/supply-chain-guard@v5`
      # always resolves to the latest v5.x.y release. This is a BRANCH, not a
      # tag - branches are meant to move, so this fast-forward push does not
      # violate the "never move tags" rule. Each release commit descends from
      # the previous one on main, so this is always a fast-forward (no --force).
      - name: Fast-forward the major-version branch to this release
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # 5.2.34
          MAJOR="v${VERSION%%.*}"          # v5
          git push origin "HEAD:refs/heads/${MAJOR}"
