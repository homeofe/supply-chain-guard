# AAHP Verify - the intended REQUIRED status check for the handoff gate.
#
# Runs the pinned @elvatis_com/aahp CLI (`aahp verify --level ci`), which
# executes all 4 handoff layers with NO escape hatch (AAHP_SKIP_VERIFY is
# ignored at --level ci). This is the off-machine, non-bypassable backstop
# behind the local pre-commit / pre-push hooks:
#   Layer 1: MANIFEST checksum integrity
#   Layer 2: content-drift gate (code changed => STATUS.md + MANIFEST.json must change)
#   Layer 3: commit-pointer freshness (advisory)
#   Layer 4: TRUST-TTL expiry (advisory)
#
# The CLI is self-contained: it runs its own bundled gate scripts, so this
# workflow no longer shells out to a vendored copy under scripts/. --no-install
# forces the pinned node_modules copy of the CLI, never a fetched one.
#
# Layer 2 is handed the base commit the EVENT knows (AAHP_BASE_SHA on the verify
# step). It used to infer one, and the inference had no notion of a wrong answer:
# on a push, actions/checkout sets the local branch to track the remote branch at
# the pushed commit, so the inferred base WAS HEAD. The gate diffed HEAD against
# itself, the change set came back empty, and an empty change set was printed as
# a pass. A required status check reported success having compared nothing. From
# outside, "nothing to compare" and "nothing wrong" looked identical.
#
# Both halves are needed and neither works alone: the CLI must be one that reads
# an explicit base and refuses a degenerate one (3.10.0 makes a missing, all-zero,
# malformed, unreadable or HEAD-equal base a blocking failure at --level ci), and
# the workflow must actually pass it. Passing a base to an older CLI is a no-op.
#
# THE EXEMPTION USED TO SIT AROUND THE GATE, WHICH MEANT THERE WAS NO GATE.
#
# Every step below once carried `if: github.actor != 'dependabot[bot]'`, including
# checkout, npm ci, verify AND doctor. On a dependabot event the job therefore ran
# one echo and reported success, and the check-run name it reported success UNDER
# was the required one. Layer 1 MANIFEST checksum integrity was skipped along with
# the Layer 2 drift gate, so the bypass was total rather than partial.
#
# That is indistinguishable from a pass when read from the pull request: on
# 2026-09-01 a dependabot pull request showed every check green while this gate had
# verified nothing at all. A required check that reports success without running is
# worse than an absent one, because it manufactures the evidence of its own success.
#
# The steps now run unconditionally. `aahp doctor`'s verify-workflow gate is
# enforced (verifyWorkflow.enforce in aahp.config.json), so re-adding a step-level
# condition here fails the build rather than silently reopening the hole.
#
# A pure dependency bump consequently FAILS Layer 2, which is the honest answer:
# dependabot cannot write STATUS.md, and this repository already lands dependency
# bumps by carrying them into a reviewed branch that does. If a green dependabot
# run is ever wanted, the supported route is handoffImpact.nonImpactingModifiedFiles
# in aahp.config.json, which keys the exception to the FILES CHANGED and is checked
# by the gate, not to who pushed them and evaluated before it.
#
name: AAHP Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    # Stated explicitly rather than left to GitHub's default. These are the same three
    # events the default implies, and writing them down is what makes the contract
    # readable and testable. Every event here creates or establishes a head sha, which
    # is the rule a required check must satisfy: the context is evaluated against the
    # head commit's check runs, so a producer that skips one of these leaves a sha with
    # nothing to report and the PR blocks on a result that never arrives.
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      base:
        # A manual run has no event base to read, and at --level ci a missing base
        # is a blocking failure rather than a silent guess. Required, so the run
        # cannot start without the one input its verdict depends on.
        description: Exact base commit SHA for the Layer 2 diff
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: aahp-verify-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  aahp-verify:
    # The check-run name is `aahp-verify`, and branch protection requires that exact
    # string. Without this line the context is the JOB KEY, which happens to be the
    # same, so it worked by coincidence. Naming it explicitly makes the contract
    # visible. Never set this to the workflow display name "AAHP Verify": that renames
    # the context and, with enforce_admins on, deadlocks every pull request.
    name: aahp-verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full history so the content-drift gate can diff against the base.
          fetch-depth: 0
          # Matches the canonical AAHP verify workflow shipped with the pinned CLI
          # release. The gate reads local history only and never talks to the remote.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      - name: Set up Python 3
        # Layer 1 (lint-handoff) validates .ai/handoff/pii-allowlist.json with Python.
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.x'

      - name: Install dependencies (pinned AAHP CLI)
        run: npm ci --ignore-scripts

      - name: Run aahp verify (CI level, no escape hatch)
        run: npx --no-install aahp verify . --level ci
        env:
          # One operand per event, and every one of them names a commit that is NOT
          # the commit under test: the pull request base, the pre-push commit, the
          # required manual input. Bound as env rather than spliced into the run
          # line, so event-controlled text stays a value and never becomes shell
          # syntax. If this resolves to empty the gate blocks; it does not guess.
          AAHP_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before || inputs.base }}

      - name: Run aahp doctor (conformance gates)
        run: npx --no-install aahp doctor . --json
