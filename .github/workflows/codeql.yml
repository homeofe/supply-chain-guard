name: CodeQL

# Static analysis (SAST) of the scanner's own code and of its workflows, with
# results in the repository's code-scanning dashboard. Added 2026-09-25 when the
# OpenSSF Scorecard reported SAST 0: no commit of the last 30 had been checked by
# a SAST tool. A supply-chain scanner that does not analyse its own source is a
# weaker argument for running it on anyone else's.
#
# Two languages. javascript-typescript covers src/ and scripts/. actions covers
# .github/workflows/ and action.yml, which is where this repository's release
# authority lives (npm trusted publishing, the MCP Registry login, the floating
# vN branch), so workflow injection is the class of bug that would matter most.
#
# Not a required check: it reports into code scanning and never blocks a merge.
# Test fixtures, the threat catalog and the generated feed are excluded. The
# fixtures are malicious-looking on purpose, and the data files hold indicators
# rather than code, so analysing them produces noise and no signal.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 4 * * 3"

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: [javascript-typescript, actions]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          config: |
            paths-ignore:
              - src/__tests__
              - data
              - feed.json
              - dist

      - name: Analyze
        uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: "/language:${{ matrix.language }}"
