name: Feed completeness

# Proves, every day, that the two committed stores (the bundle and the catalog)
# hold every malicious-package record OpenSSF publishes through OSV, and every
# evidenced entry of the DataDog malicious-software-packages-dataset.
#
# Why it exists: the daily import discovers OpenSSF records through a modified-
# date window, so a record nobody touched after that adapter was introduced was
# never fetched by any run. Nothing compared the stores against the complete
# upstream snapshot, and the first full comparison on 2026-10-05 found 164,239
# entries missing from both stores. This workflow is that comparison, run on a
# schedule so a gap of the same kind turns red instead of staying silent.
#
# `npm run feed:reconcile` downloads OSV's complete per-ecosystem all.zip
# exports, maps every MAL record with the importer's own rules and dedupes it
# against both stores. It writes nothing and fails when any record has been
# upstream for more than two days (--grace-days) and is still missing. Younger
# records are import latency that the daily import closes.
#
# Deliberately NOT a pull-request check: upstream publishes new records every
# day, so its verdict depends on the date, not on the change under review, and
# it must never block a merge.

on:
  schedule:
    - cron: "37 7 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: feed-reconcile
  cancel-in-progress: false

jobs:
  reconcile:
    name: OpenSSF snapshot reconcile
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Compare both stores against OpenSSF and the DataDog dataset
        env:
          NODE_OPTIONS: --max-old-space-size=6144
          # The DataDog source walks the dataset's file tree through the GitHub
          # API. Anonymous calls get 60 per hour per address, which a shared
          # runner can exhaust, and a gate that fails at random gets ignored.
          # The token is read-only (permissions: contents: read above).
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run feed:reconcile

      # The daily feed channel (feed-daily.yml) must publish within about a day.
      # Checked HERE, in a different workflow, so a publisher that stopped
      # running at all is noticed too. The margin over 24 hours absorbs GitHub's
      # delayed scheduled runs and the Pages deploy. Until the owner sets the
      # repository variable FEED_CHANNEL_LIVE after the first deploy, a missing
      # channel is reported but not failed.
      - name: Daily feed channel is fresh
        if: ${{ !cancelled() }}
        env:
          CHANNEL_LIVE: ${{ vars.FEED_CHANNEL_LIVE }}
        run: |
          node -e '
            const url = "https://homeofe.github.io/supply-chain-guard/feed/feed.json";
            // Armed only by the exact value "true"; "false" or a typo stays unarmed.
            const live = process.env.CHANNEL_LIVE === "true";
            (async () => {
              let feed;
              try {
                const res = await fetch(url, { signal: AbortSignal.timeout(30000) });
                if (!res.ok) throw new Error(`HTTP ${res.status}`);
                feed = await res.json();
              } catch (err) {
                if (!live) { console.log(`channel not published yet (${err.message}); FEED_CHANNEL_LIVE is unset`); return; }
                throw new Error(`the daily feed channel could not be read: ${err.message}`);
              }
              const age = Date.now() - Date.parse(feed.generatedAt);
              const hours = (age / 3600000).toFixed(1);
              // A future date would pass the age check forever; clients refuse it anyway.
              if (age < -3600 * 1000) throw new Error(`the daily feed generatedAt ${feed.generatedAt} is in the future`);
              console.log(`daily feed generatedAt ${feed.generatedAt} (${hours} h old, ${feed.entryCount} entries)`);
              if (!(age <= 30 * 3600 * 1000)) throw new Error(`the daily feed is ${hours} h old; the limit is 30 h`);
            })().catch((err) => { console.error(`::error::${err.message}`); process.exit(1); });
          '
