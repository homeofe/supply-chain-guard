version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
    # A release is picked up only after it has been public for a week: a
    # compromised version is usually caught and unpublished within days.
    # Security updates are not delayed by this.
    cooldown:
      default-days: 7
    # Development and production dependencies land in separate PRs. From
    # @elvatis_com/aahp 4.0.0 on, a PR that changes only integrity-pinned
    # registry devDependencies can be exempted from the aahp-verify handoff
    # gate by content (handoffImpact.npmDevDependencyUpdates); a runtime
    # dependency change always needs a handoff entry, so mixing the two in one
    # PR would hold the dev updates back.
    groups:
      npm-development:
        applies-to: version-updates
        dependency-type: development
      npm-production:
        applies-to: version-updates
        dependency-type: production
    ignore:
      # commander 15+ is ESM-only (no CommonJS "require" export) and requires
      # Node >=22.12. This package ships as a CommonJS CLI + require()-able
      # library with engines node >=22.0.0, so it stays on the commander 14.x (CJS)
      # line until a deliberate ESM migration. See PR #39.
      - dependency-name: "commander"
        versions: [">=15"]
  # The pinned npm that publishes this package (.github/publish-toolchain).
  # npm ships its own dependencies bundled inside its tarball, so an advisory
  # against one of them can only be resolved by a new npm release: a security
  # update of a bundled package is not possible and only fails; `allow` keeps
  # security updates to the pin itself, and the preflight audits the bundled
  # packages (scripts/audit-publish-toolchain.mjs). Version updates are off
  # (limit 0): the pin moves by hand, deliberately, including across majors
  # (docs/node-support.md). With a limit, Dependabot proposed npm 12 and the
  # pull request was refused on creation.
  - package-ecosystem: "npm"
    directory: "/.github/publish-toolchain"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 0
    labels:
      - "dependencies"
    allow:
      - dependency-name: "npm"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # One PR per week for all action pins: each one changes a workflow file and
    # needs a handoff entry, so one grouped PR means one entry.
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
  # Keeps the digest-pinned node:24-alpine base image in the Dockerfile fresh:
  # the FROM lines pin by sha256 digest, so security updates only arrive via
  # these deliberate weekly bump PRs.
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    labels:
      - "dependencies"
    ignore:
      # The Node base image stays on the deliberately chosen LTS major (bumped
      # by hand). Dependabot brings digest / patch / minor refreshes only, not
      # major jumps: PR #49 proposed node 20 -> 26-alpine (premature, barely
      # LTS) for a security tool's own image. See CHANGELOG v5.6.1.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
