# Secret scanning configuration (GitHub reads this exact path).
#
# data/threat-catalog/ holds more than 250,000 malicious package names
# copied from public advisory databases (OpenSSF, GitHub Advisory Database).
# Attackers pick names freely, so some of them match credential shapes: the
# first alert (2026-10-05, "Tencent WeChat API App ID") was the npm malware
# package of MAL-2025-2613, not a secret. Every line of that file is public
# advisory data written by scripts/import-threat-feed.mjs, and
# scripts/generate-catalog.mjs refuses to publish a line with an unknown field
# or a private address, host or path shape.
#
# Only this one generated data file is excluded. Code, docs, workflows and the
# bundled feed (src/threat-intel.ts) stay scanned.
paths-ignore:
  - "data/threat-catalog/**"
